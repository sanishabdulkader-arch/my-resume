<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Illustrated portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d7d8c"/>
      <stop offset="1" stop-color="#134e9b"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7f5"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <circle cx="158" cy="42" r="52" fill="#ffffff" opacity=".08"/>
    <circle cx="34" cy="152" r="64" fill="#ffffff" opacity=".07"/>

    <!-- shoulders -->
    <path d="M14 200c2-38 32-58 86-58s84 20 86 58z" fill="url(#shirt)"/>
    <!-- collar -->
    <path d="M86 146c4 8 10 13 14 13s10-5 14-13l-14-6z" fill="#c7d7ea"/>
    <!-- neck -->
    <path d="M88 118h24v30c0 8-24 8-24 0z" fill="#e0ab86"/>
    <!-- ears -->
    <circle cx="64" cy="92" r="7" fill="#e8b794"/>
    <circle cx="136" cy="92" r="7" fill="#e8b794"/>
    <!-- head -->
    <ellipse cx="100" cy="86" rx="36" ry="40" fill="#f0c3a0"/>
    <!-- hair -->
    <path d="M62 84c-2-30 14-48 40-48 27 0 40 19 37 48-4-10-9-16-14-19-10 7-38 9-52 2-5 4-8 9-11 17z" fill="#2b2118"/>
    <!-- eyebrows -->
    <path d="M80 82c4-3 10-3 14-1M106 81c4-2 10-2 14 1" stroke="#3a2c22" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- eyes -->
    <circle cx="87" cy="90" r="3.2" fill="#2b2118"/>
    <circle cx="113" cy="90" r="3.2" fill="#2b2118"/>
    <!-- nose -->
    <path d="M100 92v10c0 2-2 3-4 3" stroke="#d69a76" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- smile -->
    <path d="M89 110c4 5 18 5 22 0" stroke="#b06a4d" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- cheeks -->
    <circle cx="78" cy="101" r="5" fill="#e79b86" opacity=".45"/>
    <circle cx="122" cy="101" r="5" fill="#e79b86" opacity=".45"/>
  </g>
</svg>
